# --- Colors & Terminal ---
# This ensures NeoVim gets full color support inside the container
set -g default-terminal "xterm-256color"
set -as terminal-features ",xterm-256color:RGB"

# --- Quality of Life ---
set -g mouse on               # Enable scrolling with the mouse wheel
set -g history-limit 50000    # Big scrollback for long DuckDB outputs
set -s escape-time 0          # Fixes Vim mode-switching lag
set -g base-index 1           # Start window numbering at 1 (easier to reach)
setw -g pane-base-index 1

# --- Status Bar (Minimal) ---
set -g status-style bg=default,fg=white
set -g status-left "[#S] "
set -g status-right "%H:%M %d-%b-%y"
